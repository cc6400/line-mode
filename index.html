<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房屋价格预测 Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .desc {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .panel {
            flex: 1;
            min-width: 300px;
        }

        .panel h2 {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group label {
            font-weight: 500;
            color: #555;
        }

        .input-group input {
            width: 150px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .result-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 200px;
        }

        .result-price {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            margin: 10px 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
        }

        .result-price.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-unit {
            font-size: 18px;
            color: #7f8c8d;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }

        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .data-table th {
            background-color: #f2f2f2;
            color: #333;
        }

        .highlight {
            background-color: #fff3cd;
            font-weight: bold;
        }

        .weights-info {
            margin-top: 15px;
            font-size: 12px;
            color: #95a5a6;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 房屋估价预测系统 (线性回归 Demo)</h1>
    <p class="desc">基于历史交易数据，利用前端 JS 动态训练多元线性回归模型，预测房屋 X 的售价。</p>

    <div class="content">
        <!-- 左侧：输入面板 -->
        <div class="panel">
            <h2>房屋特征输入 (X)</h2>
            <div class="input-group">
                <label>房子大小 (平米)</label>
                <input type="number" id="area" value="120">
            </div>
            <div class="input-group">
                <label>距地铁站距离 (km)</label>
                <input type="number" step="0.1" id="dist" value="1.5">
            </div>
            <div class="input-group">
                <label>卧室数量 (个)</label>
                <input type="number" id="rooms" value="3">
            </div>
            <div class="input-group">
                <label>周边商城个数 (个)</label>
                <input type="number" id="malls" value="2">
            </div>
            <button class="btn" onclick="predict()">开始估价</button>
        </div>

        <!-- 右侧：结果面板 -->
        <div class="panel">
            <h2>估价结果</h2>
            <div class="result-box">
                <div id="loading" style="display: none; color: #3498db;">模型训练与计算中...</div>
                <div id="priceContainer" style="display: none;">
                    <span class="result-price" id="resultPrice">0</span>
                    <span class="result-unit">万元</span>
                </div>
                <div id="placeholder" style="color: #bdc3c7;">点击左侧按钮获取估价</div>
            </div>
        </div>
    </div>

    <!-- 底部：历史数据参考 -->
    <div>
        <h2 style="font-size: 16px; color: #34495e; margin-top: 20px;">📊 用于训练的已知数据</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>房屋</th>
                    <th>大小</th>
                    <th>距地铁</th>
                    <th>卧室</th>
                    <th>商城</th>
                    <th>售价</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>A</td><td>100</td><td>1.1</td><td>2</td><td>2</td><td>1223</td></tr>
                <tr><td>B</td><td>58</td><td>0.4</td><td>1</td><td>4</td><td>845</td></tr>
                <tr><td>C</td><td>220</td><td>3.2</td><td>5</td><td>1</td><td>1352</td></tr>
                <tr><td>D</td><td>91</td><td>0.7</td><td>2</td><td>3</td><td>1122</td></tr>
                <tr class="highlight"><td>X (待预测)</td><td>120</td><td>1.5</td><td>3</td><td>2</td><td>?</td></tr>
            </tbody>
        </table>
        <div class="weights-info" id="weightsInfo">
            <!-- 权重信息通过JS填充 -->
        </div>
    </div>
</div>

<script>
    // 1. 准备训练数据
    const trainData = [
        { features: [100, 1.1, 2, 2], price: 1223 },
        { features: [58, 0.4, 1, 4], price: 845 },
        { features: [220, 3.2, 5, 1], price: 1352 },
        { features: [91, 0.7, 2, 3], price: 1122 }
    ];

    let model = {
        weights: [0, 0, 0, 0],
        bias: 0,
        meanX: [0, 0, 0, 0],
        stdX: [0, 0, 0, 0],
        meanY: 0,
        stdY: 0
    };

    // 2. 数据归一化与模型训练 (在页面加载时执行)
    function trainModel() {
        const m = trainData.length;
        const numFeatures = 4;

        // 计算特征和标签的均值和标准差 (用于Z-score归一化，防止梯度爆炸)
        for (let j = 0; j < numFeatures; j++) {
            let sum = 0;
            for (let i = 0; i < m; i++) sum += trainData[i].features[j];
            model.meanX[j] = sum / m;

            let varSum = 0;
            for (let i = 0; i < m; i++) varSum += Math.pow(trainData[i].features[j] - model.meanX[j], 2);
            model.stdX[j] = Math.sqrt(varSum / m) || 1; // 防止除以0
        }

        let sumY = 0;
        for (let i = 0; i < m; i++) sumY += trainData[i].price;
        model.meanY = sumY / m;

        let varSumY = 0;
        for (let i = 0; i < m; i++) varSumY += Math.pow(trainData[i].price - model.meanY, 2);
        model.stdY = Math.sqrt(varSumY / m) || 1;

        // 准备归一化后的数据
        const X_norm = [];
        const Y_norm = [];
        for (let i = 0; i < m; i++) {
            let xRow = [];
            for (let j = 0; j < numFeatures; j++) {
                xRow.push((trainData[i].features[j] - model.meanX[j]) / model.stdX[j]);
            }
            X_norm.push(xRow);
            Y_norm.push((trainData[i].price - model.meanY) / model.stdY);
        }

        // 梯度下降超参数
        const learningRate = 0.05;
        const epochs = 2000;
        
        // 开始训练
        for (let epoch = 0; epoch < epochs; epoch++) {
            let dw = [0, 0, 0, 0];
            let db = 0;

            for (let i = 0; i < m; i++) {
                // 预测值
                let prediction = model.bias;
                for (let j = 0; j < numFeatures; j++) {
                    prediction += model.weights[j] * X_norm[i][j];
                }
                
                // 计算误差
                let error = prediction - Y_norm[i];

                // 累加梯度
                for (let j = 0; j < numFeatures; j++) {
                    dw[j] += error * X_norm[i][j];
                }
                db += error;
            }

            // 更新权重和偏置
            for (let j = 0; j < numFeatures; j++) {
                model.weights[j] -= learningRate * (dw[j] / m);
            }
            model.bias -= learningRate * (db / m);
        }

        // 打印模型参数
        console.log("模型训练完成！归一化权重:", model.weights);
        document.getElementById("weightsInfo").innerText = 
            `【后台计算信息】模型已训练完毕。基于4条数据拟合的多元线性方程：售价 ≈ ${(model.weights[0]*10).toFixed(2)}*面积 + ${(model.weights[1]*10).toFixed(2)}*距离 + ... + 偏置`;
    }

    // 3. 预测函数 (绑定在按钮上)
    function predict() {
        // 获取输入值
        const inputX = [
            parseFloat(document.getElementById('area').value),
            parseFloat(document.getElementById('dist').value),
            parseFloat(document.getElementById('rooms').value),
            parseFloat(document.getElementById('malls').value)
        ];

        // UI 交互效果
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('priceContainer').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        
        const priceElement = document.getElementById('resultPrice');
        priceElement.classList.remove('show');

        // 模拟网络请求的延迟，增加真实感
        setTimeout(() => {
            // 归一化输入特征
            const X_norm = [];
            for (let j = 0; j < inputX.length; j++) {
                X_norm.push((inputX[j] - model.meanX[j]) / model.stdX[j]);
            }

            // 计算归一化后的预测值
            let y_pred_norm = model.bias;
            for (let j = 0; j < inputX.length; j++) {
                y_pred_norm += model.weights[j] * X_norm[j];
            }

            // 反归一化，还原真实价格
            let y_pred = y_pred_norm * model.stdY + model.meanY;

            // 限制不要出现离谱的负数
            if (y_pred < 0) y_pred = 0;

            // 显示结果
            document.getElementById('loading').style.display = 'none';
            document.getElementById('priceContainer').style.display = 'block';
            priceElement.innerText = y_pred.toFixed(2);
            
            // 触发 CSS 动画
            setTimeout(() => {
                priceElement.classList.add('show');
            }, 50);

        }, 500);
    }

    // 页面加载完成后立即训练模型
    window.onload = function() {
        trainModel();
    };
</script>

</body>
</html>
